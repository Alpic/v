# Deploy web/ to GitHub Pages when web/ (or data/config.json, which becomes web/method.json) changes on main,
# and after the Android workflow finished (it commits web/version.json with GITHUB_TOKEN, which does not trigger push workflows).
name: pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/config.json']
  workflow_run:
    workflows: [Android]
    types: [completed]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, persist-credentials: false }
      - run: cp data/config.json web/method.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
