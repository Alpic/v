# Every 15 min: RSS + GDELT ingest -> embed -> cluster -> rank -> summaries -> retention (pipeline/run.mjs).
# Note: GitHub disables scheduled workflows after 60 days without repo activity; export.yml commits weekly, which keeps it alive.
# DB access: Postgres role v_writer (V-only) via the pooler string in secret V_DB_URL. No service key.
name: ingest
on:
  schedule: [{ cron: '7,22,37,52 * * * *' }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with: { path: .cache, key: hf-e5-small-761b726 }
      - run: node pipeline/run.mjs
        env:
          V_MODEL_CACHE: ${{ github.workspace }}/.cache
          V_DB_URL: ${{ secrets.V_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
