# Weekly: voice-based outlet lean (v_outlet_lean) + merge of duplicate stories of the last 7 days.
name: lean
on:
  # schedule disabled 2026-11-04: the pipeline runs on klj2 (MASTERPLAN C0); manual workflow_dispatch stays as fallback. Was: [{ cron: '23 4 * * 1' }]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node pipeline/lean.mjs
        env: { V_DB_URL: '${{ secrets.V_DB_URL }}' }
      - run: node pipeline/cluster.mjs merge
        env: { V_DB_URL: '${{ secrets.V_DB_URL }}' }
